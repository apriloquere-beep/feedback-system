name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-ftp
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, openssl, pdo_mysql
          coverage: none

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Create production environment
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "PRODUCTION_ENV_FILE secret is missing."
            exit 1
          fi
          if [ -z "$MAIL_USERNAME" ] || [ -z "$MAIL_PASSWORD" ] || [ -z "$MAIL_FROM_ADDRESS" ]; then
            echo "MAIL_USERNAME, MAIL_PASSWORD, and MAIL_FROM_ADDRESS secrets are required."
            exit 1
          fi
          printf '%s' "$PRODUCTION_ENV_FILE" > .env
          sed -i '/^MAIL_/d' .env
          printf '\nMAIL_HOST=smtp.gmail.com\nMAIL_PORT=587\nMAIL_ENCRYPTION=tls\n' >> .env
          printf 'MAIL_USERNAME=%s\n' "$MAIL_USERNAME" >> .env
          printf 'MAIL_PASSWORD=%s\n' "$MAIL_PASSWORD" >> .env
          printf 'MAIL_FROM_ADDRESS=%s\n' "$MAIL_FROM_ADDRESS" >> .env
          printf 'MAIL_FROM_NAME=SFMS\n' >> .env

      - name: Deploy application
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PORT: ${{ secrets.FTP_PORT }}
        run: python deployment/ftp_deploy.py
